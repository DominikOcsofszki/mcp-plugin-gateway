[project]
name = "mcp-plugin-gateway"
version = "0.1.0"
description = "Host FastMCP plugins behind an aggregate MCP gateway and generated CLI."
readme = "README.md"
authors = [
    { name = "Dominik Ocsofszki", email = "dominikocsofszki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
]

[project.scripts]
mcp-plugin-gateway = "mcp_plugin_gateway.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_plugin_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------
# Plugin entry points
# ---------------------------------------------------------------------------
#
# Plugins are discovered exclusively through the ``mcp_plugin_gateway.plugins``
# entry-point group. A plugin distribution declares exactly one entry point in
# that group whose value resolves to a zero-argument callable returning a
# single, bare ``fastmcp.FastMCP`` instance:
#
#     [project.entry-points."mcp_plugin_gateway.plugins"]
#     alpha = "alpha_plugin:build_server"
#
# Rules:
#   * The entry-point *name* is the plugin name used on both surfaces (CLI
#     command group and MCP namespace). It must be unique across all installed
#     distributions; duplicates are rejected at registration with an error that
#     names both offending distributions.
#   * The entry-point *value* must be an importable ``module:attribute`` path
#     pointing at a callable that takes no arguments and returns a ``FastMCP``.
#     Returning anything else is a contract violation and is reported against
#     the offending plugin.
#   * The callable is invoked lazily, on first access, so importing a plugin
#     distribution must not read configuration or start servers.
#   * An empty group is valid and yields no plugins. Groups other than
#     ``mcp_plugin_gateway.plugins`` are ignored.
#
# Surface tags:
#   * Tools are reachable from both the CLI and MCP clients by default. Tag a
#     tool to restrict it to one surface:
#       - ``cli`` -- hidden from MCP clients, reachable from the CLI.
#       - ``mcp`` -- hidden from the CLI, reachable from MCP clients.
#     Any other tag is a typo and fails loudly at registration.
#
# This project itself declares no plugins, so the group is empty here. The
# group is documented (rather than declared) so that installing this package
# never registers a plugin.
#
# The authoritative, non-stale description of this contract is generated from
# the code that implements it:
#
#     mcp-plugin-gateway authoring
#
# That command prints the entry-point group, the callable shape, the surface
# tags, and a worked example, all interpolated from the constants that define
# them. The block above is a human-facing copy; the command is the source of
# truth.
