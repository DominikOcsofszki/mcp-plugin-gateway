[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-plugin"
version = "0.1.0"
description = "Example plugin whose settings require a secret; used to prove the build-time configuration check."
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.0", "pydantic-settings>=2.0", "mcp-plugin-gateway"]

[project.entry-points."mcp_plugin_gateway.plugins"]
secure-plugin = "secure_plugin:make_plugin"

[tool.hatch.build.targets.wheel]
packages = ["secure_plugin"]
